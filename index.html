<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мессенджеры</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мессенджеры">
<meta name="theme-color" content="#0b1a24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --tg: #229ed9;
    --tg-deep: #0f6e9c;
    --wa: #25d366;
    --wa-deep: #0b7a3c;
    --ink: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    background: #0b1a24;
    color: var(--ink);
    overflow: hidden;
  }
  main {
    height: 100%;
    display: grid;
    grid-template-rows: 1fr 1fr;
  }
  a.choice {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    color: var(--ink);
    text-decoration: none;
    text-align: center;
    padding: env(safe-area-inset-top, 0px) 24px 0;
    transition: filter .15s, transform .15s;
  }
  a.choice:last-child { padding: 0 24px env(safe-area-inset-bottom, 0px); }
  a.choice:active { filter: brightness(.9); transform: scale(.985); }
  a.choice:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
  .tg { background: linear-gradient(160deg, var(--tg), var(--tg-deep)); }
  .wa { background: linear-gradient(160deg, var(--wa), var(--wa-deep)); }
  svg { width: 84px; height: 84px; fill: currentColor; }
  .name { font-size: clamp(34px, 11vw, 56px); font-weight: 700; letter-spacing: -.02em; }
  .hint { font-size: 17px; opacity: .85; }
  .toast {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: rgba(0,0,0,.82); color: #fff;
    padding: 14px 16px; border-radius: 14px;
    font-size: 15px; line-height: 1.35;
    display: none;
  }
  .toast.show { display: block; }
  .toast a { color: #8fd3ff; }
</style>
</head>
<body>
<main>
  <a class="choice tg" id="tg" href="tg://" data-web="https://web.telegram.org/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.4-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.6 13.3 1.9 11.8c-1-.3-1-1 .2-1.5L20.4 3.2c.9-.3 1.6.2 1.5 1.1z"/></svg>
    <span class="name">Telegram</span>
    <span class="hint">Открыть приложение</span>
  </a>
  <a class="choice wa" id="wa" href="whatsapp://" data-web="https://web.whatsapp.com/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.2.2-.3.2-.5.1-.8-.4-1.700-.9-2.400-1.800-.2-.3 0-.4.1-.5l.4-.5c.1-.1.100-.3.200-.4 0-.2 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.100-.7.300-.2.300-.9.900-.9 2.200s.9 2.500 1.100 2.700c.1.200 1.800 2.800 4.400 3.900 1.600.7 2.200.7 3 .6.500-.1 1.500-.6 1.700-1.200.2-.6.2-1.100.2-1.200-.1-.1-.3-.2-.5-.3z"/></svg>
    <span class="name">WhatsApp</span>
    <span class="hint">Открыть чат (долгое нажатие: сменить номер)</span>
  </a>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
  var isAndroid = /Android/i.test(navigator.userAgent);
  var toast = document.getElementById('toast');

  // Android: intent-ссылки открывают установленное приложение напрямую.
  // iPhone: схемы tg:// и whatsapp://.
  if (isAndroid) {
    document.getElementById('tg').href =
      'intent://resolve#Intent;scheme=tg;package=org.telegram.messenger;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=org.telegram.messenger') + ';end';
  }

  // Подсказка только если приложение точно не открылось.
  function attach(id, title) {
    var el = document.getElementById(id);
    el.addEventListener('click', function () {
      var left = false;
      function gone() { left = true; }
      document.addEventListener('visibilitychange', gone);
      window.addEventListener('pagehide', gone);
      window.addEventListener('blur', gone);
      setTimeout(function () {
        document.removeEventListener('visibilitychange', gone);
        window.removeEventListener('pagehide', gone);
        window.removeEventListener('blur', gone);
        if (!left) {
          toast.textContent = title + ' не открылся. Откройте эту страницу в обычном браузере, а не внутри другого приложения.';
          toast.classList.add('show');
          setTimeout(function () { toast.classList.remove('show'); }, 6000);
        }
      }, 2500);
    });
  }

  // WhatsApp не открывается «просто так»: ему нужен чат. Открываем чат с сохранённым номером
  // (можно указать свой: тогда откроется «Сообщения себе»).
  function waLink(num) {
    return isAndroid
      ? 'intent://send?phone=' + num + '#Intent;scheme=whatsapp;package=com.whatsapp;end'
      : 'whatsapp://send?phone=' + num;
  }
  function getNum(force) {
    var n = '';
    try { n = localStorage.getItem('wa_num') || ''; } catch (e) {}
    if (!n || force) {
      var v = prompt('Номер для чата WhatsApp, с кодом страны, например 79001234567. Можно свой.', n);
      if (v === null) return '';
      n = v.replace(/\D/g, '');
      try { localStorage.setItem('wa_num', n); } catch (e) {}
    }
    return n;
  }
  document.getElementById('wa').addEventListener('click', function (e) {
    e.preventDefault();
    var n = getNum(false);
    if (n) window.location.href = waLink(n);
  });
  document.getElementById('wa').addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var n = getNum(true);
    if (n) window.location.href = waLink(n);
  });
  attach('tg', 'Telegram');
  attach('wa', 'WhatsApp');
</script>
</body>
</html>
